[package]
name = "marki-parse"
version = "0.1.2"
edition = "2024"
description = "A fast, zero-copy CommonMark parser with SIMD-accelerated scanning"
license = "MIT"
repository = "https://github.com/42Pupusas/marki"
readme = "README.md"
keywords = ["markdown", "commonmark", "parser", "zero-copy"]
categories = ["parsing", "text-processing"]
rust-version = "1.87"
exclude = ["flamegraph.svg", "perf.data*", "fuzz/"]

[lints.clippy]
pedantic = "warn"
perf = "warn"
nursery = "warn"

[dev-dependencies]
divan = "0.1"
pulldown-cmark = { version = "0.12", features = ["simd"] }

[[bench]]
name = "parse"
harness = false

[[bench]]
name = "vs_pulldown_cmark"
harness = false

[profile.bench]
debug = true
lto = "fat"
codegen-units = 1
