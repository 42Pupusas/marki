[package]
name = "marki-parse"
version = "0.3.0"
edition = "2024"
description = "A fast, zero-copy CommonMark and GitHub Flavored Markdown parser with SIMD-accelerated scanning"
license = "MIT"
repository = "https://github.com/42Pupusas/marki"
readme = "README.md"
keywords = ["markdown", "commonmark", "gfm", "parser", "zero-copy"]
categories = ["parsing", "text-processing"]
rust-version = "1.88"
exclude = ["flamegraph.svg", "perf.data*", "fuzz/", "benches/", "examples/"]

[features]
default = ["gfm"]
# GitHub Flavored Markdown: tables, strikethrough, task lists, extended
# autolinks, disallowed raw HTML, footnotes, and alerts. Without it the parser
# is strict CommonMark 0.31.2.
gfm = []

[lints.clippy]
pedantic = "warn"
perf = "warn"
nursery = "warn"

[dev-dependencies]
divan = "0.1"
pulldown-cmark = { version = "0.12", features = ["simd"] }
comrak = "0.52"

[[bench]]
name = "parse"
harness = false

[[bench]]
name = "vs_pulldown_cmark"
harness = false

[profile.bench]
debug = true
lto = "fat"
codegen-units = 1
